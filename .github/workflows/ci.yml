name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      - name: Run CI steps (fmt, clippy, test, build)
        run: cargo fmt -- --check && cargo clippy --all-targets --all-features -- -D warnings && cargo test --verbose && cargo build --release --verbose
