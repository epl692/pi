[package]
name = "pi"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
num-bigint = "0.4"
num-integer = "0.1.46"
num-traits = "0.2"
rayon = "1.7"

[dev-dependencies]
criterion = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
